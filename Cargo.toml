[package]
name = "simple-converter"
version = "0.2.0"
edition = "2024"
description = "Fast local video/image/audio converter with a minimal web UI (FFmpeg inside)"
license = "MIT"
repository = "https://github.com/rostislav-kuparo/simple-converter"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
